[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "marl-offload"
version = "0.2.0"
description = "Multi-agent reinforcement learning for edge-cloud computation offloading, with leader-follower pricing"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ossama Sabti" }]
dependencies = ["numpy>=1.24", "torch>=2.0", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["marl_offload"]

[tool.pytest.ini_options]
testpaths = ["tests"]
